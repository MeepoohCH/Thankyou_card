<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#F6D56F"
    >

    <title>A Little Note For You 🍯</title>

    <!-- ฟอนต์ภาษาไทยลายมือน่ารัก -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Mali:wght@300;400;500;600&family=Patrick+Hand&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body>

    <!-- =====================================
         Background
    ====================================== -->

    <div class="background-decoration">

        <span class="leaf leaf-1">❧</span>
        <span class="leaf leaf-2">❧</span>

        <span class="bee bee-1">🐝</span>
        <span class="bee bee-2">🐝</span>

        <span class="tiny-heart heart-1">♡</span>
        <span class="tiny-heart heart-2">♡</span>

    </div>


    <main class="container">


        <!-- =====================================
             COVER
        ====================================== -->

        <section
            id="coverPage"
            class="page active"
        >

            <div class="book-cover">


                <!-- Honey ด้านบน -->

                <div class="honey-top">

                    <span></span>
                    <span></span>
                    <span></span>

                </div>


                <!-- หมี -->

                <div class="bear">

                    <div class="bear-ear left-ear"></div>
                    <div class="bear-ear right-ear"></div>

                    <div class="bear-face">

                        <div class="bear-eye left-eye"></div>
                        <div class="bear-eye right-eye"></div>

                        <div class="bear-nose"></div>

                        <div class="bear-mouth"></div>

                    </div>

                </div>


                <p class="small-title">
                    A LITTLE NOTE FOR
                </p>


                <h1 id="coverName">
                    ...
                </h1>


                <div class="little-line">

                    <span></span>

                    <div>♡</div>

                    <span></span>

                </div>


                <p class="cover-message">
                    น้องฝึกงานคนนี้มีอะไรอยากบอกพี่นิดนึง :) 
                </p>


                <div class="honey-pot">

                    <div class="pot-top"></div>

                    <div class="pot">

                        <span>
                            HUNNY
                        </span>

                    </div>

                </div>


                <button id="openButton">

                    เปิดอ่านเลย

                    <span>
                        ♡
                    </span>

                </button>


                <p class="tiny-message">
                    a small note, just for you
                </p>


            </div>

        </section>


        <!-- =====================================
             LETTER
        ====================================== -->

        <section
            id="letterPage"
            class="page"
        >

            <article class="paper">


                <!-- เทปแปะกระดาษ -->

                <div class="tape"></div>


                <!-- ผึ้ง -->

                <div class="letter-bee">
                    🐝
                </div>


                <div class="paper-top">

                    <span>
                        a little friendship note
                    </span>

                    <span>
                        ♡
                    </span>

                </div>


                <h1 class="letter-title">

                    ถึง

                    <span id="letterName"></span>

                </h1>


                <div class="scribble-line"></div>


                <!-- ข้อความของแต่ละคน -->

                <div
                    id="message"
                    class="message"
                ></div>


                <!-- Ending -->

                <div class="ending">

                    <div class="ending-heart">
                        ♡
                    </div>

                    <p>
                        ขอบคุณสำหรับทุกอย่างและช่วงเวลาดี ๆ นะคะ
                    </p>


                    <p class="signature">
                        — Meepooh —
                    </p>

                </div>


                <div class="footer-honey">

                    <span>
                        🐝
                    </span>

                    <span>
                        · · ·
                    </span>

                    <span>
                        🍯
                    </span>

                    <span>
                        · · ·
                    </span>

                    <span>
                        ♡
                    </span>

                </div>


            </article>

        </section>


        <!-- =====================================
             ERROR
        ====================================== -->

        <section
            id="errorPage"
            class="page"
        >

            <div class="error-card">

                <div class="error-bear">
                    🐻
                </div>

                <h1>
                    Oops!
                </h1>

                <p>
                    เหมือนจะเปิดจดหมายผิดฉบับนะ
                </p>

                <span>
                    🍯
                </span>

            </div>

        </section>


    </main>


    <script src="script.js"></script>

</body>

</html>
